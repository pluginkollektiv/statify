name: Test
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '7.4'
            wordpress: '5.9'
          - php: '8.0'
            wordpress: '6.0'
          - php: '8.1'
            wordpress: '6.3'
          - php: '8.2'
            wordpress: '6.6'
          - php: '8.3'
            wordpress: '6.9'
          - php: '8.4'
            wordpress: '7.0'
          - php: '8.5'
            wordpress: '7.1'
          - php: '8.5'
            wordpress: 'nightly'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{matrix.php}}
          tools: composer
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup DB
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: 'mysql-8.0'
          root-password: "root"
          my-cnf: |
            default_authentication_plugin=mysql_native_password
      - name: Install
        run: |
          composer install --no-interaction
          npm ci --ignore-scripts
      - name: Setup WP
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 "${{ matrix.wordpress }}"
      - name: PHP unit tests
        run: composer test
      - name: Check TypeScript
        run: npm run check
      - name: JS unit tests
        run: npm run test
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install
        run: |
          composer install --no-interaction
          npm ci --ignore-scripts
      - name: Code style checks for PHP
        run: composer lint-php
      - name: Code style checks for JS
        run: npm run lint-js
      - name: Code style checks for CSS
        run: npm run lint-css
